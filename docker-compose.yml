# ChromaDB as a service, for module 8.
#
#   podman compose up -d        (or: docker compose up -d)
#   curl http://localhost:8000/api/v2/heartbeat
#
# Everything else in this course runs without a container. This file exists because a vector
# database is a service in production, not a library call, and the difference is worth seeing
# rather than being told about. The API is identical either way; what changes is who owns it,
# who restarts it, and what happens when it is not there.
#
# Note the path: /api/v2/. The v1 path is all over the internet and returns 404 on this version.

services:
  chroma:
    image: docker.io/chromadb/chroma:latest
    container_name: helios-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma-data:
